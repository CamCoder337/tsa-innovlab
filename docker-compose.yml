version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tsa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tsa_contest
      POSTGRES_USER: tsa_user
      POSTGRES_PASSWORD: tsa_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsa_user -d tsa_contest"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tsa-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tsa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass tsa_redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tsa-network

  # AdonisJS Monolith (Main API)
  tsa-monolith:
    build:
      context: ./services/tsa-monolith
      dockerfile: Dockerfile
    container_name: tsa-monolith
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: tsa_user
      DB_PASSWORD: tsa_password
      DB_DATABASE: tsa_contest
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: tsa_redis_password
      APP_KEY: your-32-character-secret-key-here
      SESSION_DRIVER: redis
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        node ace migration:run --force &&
        echo 'Migrations completed, starting server...' &&
        node bin/server.js
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - tsa-network

  # FastAPI AI Service
  tsa-ai:
    build:
      context: ./services/tsa-ai
      dockerfile: Dockerfile
    container_name: tsa-ai
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      ENVIRONMENT: production
      DATABASE_URL: postgresql://tsa_user:tsa_password@postgres:5432/tsa_contest
      REDIS_URL: redis://:tsa_redis_password@redis:6379/0
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tsa-monolith:
        condition: service_healthy
    volumes:
      - ai_models:/app/ml_models
      - ai_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ai/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - tsa-network

  # Nginx Load Balancer & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tsa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - tsa-monolith
      - tsa-ai
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tsa-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ai_models:
    driver: local
  ai_logs:
    driver: local
  nginx_logs:
    driver: local

networks:
  tsa-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16