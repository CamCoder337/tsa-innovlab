# ================================
# TSA Logistics - Docker Compose Configuration
# ================================
# Development and staging environment setup
version: '3.8'

# =====================================
# Shared Network Configuration
# =====================================
networks:
  tsa-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# =====================================
# Persistent Volume Configuration  
# =====================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ai_models:
    driver: local
  ai_logs:
    driver: local
  nginx_logs:
    driver: local
  monolith_logs:
    driver: local

# =====================================
# Services Configuration
# =====================================
services:
  # ===================
  # PostgreSQL Database
  # ===================
  postgres:
    image: postgres:16-alpine
    container_name: tsa-postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tsa_contest}
      POSTGRES_USER: ${POSTGRES_USER:-tsa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tsa_strong_password_2024!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d
    
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tsa_user} -d ${POSTGRES_DB:-tsa_contest}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    # Security and performance
    security_opt:
      - no-new-privileges:true
    
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    
    networks:
      - tsa-network

  # =============
  # Redis Cache
  # =============
  redis:
    image: redis:7-alpine
    container_name: tsa-redis
    restart: unless-stopped
    
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-tsa_redis_strong_password_2024!}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
      --save 900 1
      --save 300 10
      --save 60 10000
    
    volumes:
      - redis_data:/data
    
    ports:
      - "${REDIS_PORT:-6379}:6379"
    
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-tsa_redis_strong_password_2024!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    # Security and performance
    security_opt:
      - no-new-privileges:true
    
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    
    networks:
      - tsa-network

  # =====================
  # AdonisJS Monolith API
  # =====================
  tsa-monolith:
    build:
      context: ./services/tsa-monolith
      dockerfile: Dockerfile
      target: production
      args:
        NODE_ENV: production
    
    container_name: tsa-monolith
    restart: unless-stopped
    
    environment:
      # Application
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      TZ: UTC
      APP_KEY: ${APP_KEY:-your-32-character-secret-key-here}
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-tsa_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-tsa_strong_password_2024!}
      DB_DATABASE: ${POSTGRES_DB:-tsa_contest}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-tsa_redis_strong_password_2024!}
      
      # Session
      SESSION_DRIVER: redis
      
      # Email
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@tsa-logistics.com}
      
      # URLs
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3333}
      
      # Security
      SECURE_COOKIES: true
      TRUST_PROXY: true
    
    volumes:
      - monolith_logs:/app/logs
      - /app/node_modules
    
    ports:
      - "${MONOLITH_PORT:-3333}:3333"
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    # Improved startup with migrations
    command: >
      sh -c "
        echo '🚀 Starting TSA Monolith...' &&
        echo '📊 Waiting for database connection...' &&
        timeout 60 sh -c 'until nc -z postgres 5432; do sleep 1; done' &&
        echo '🗄️ Running database migrations...' &&
        node ace migration:run --force &&
        echo '🌱 Seeding database (if needed)...' &&
        node ace db:seed --force || true &&
        echo '✅ Starting application server...' &&
        node build/bin/server.js
      "
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    
    # Security and performance
    security_opt:
      - no-new-privileges:true
    
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    
    networks:
      - tsa-network

  # ===================
  # FastAPI AI Service
  # ===================
  tsa-ai:
    build:
      context: ./services/tsa-ai
      dockerfile: Dockerfile
    
    container_name: tsa-ai
    restart: unless-stopped
    
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tsa_user}:${POSTGRES_PASSWORD:-tsa_strong_password_2024!}@postgres:5432/${POSTGRES_DB:-tsa_contest}
      REDIS_URL: redis://:${REDIS_PASSWORD:-tsa_redis_strong_password_2024!}@redis:6379/1
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
      
      # ML Model settings
      MODEL_CACHE_SIZE: 3
      MODEL_PREDICTION_TIMEOUT: 30
      
      # Logging
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    
    volumes:
      - ai_models:/app/ml_models
      - ai_logs:/app/logs
    
    ports:
      - "${AI_PORT:-8000}:8000"
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tsa-monolith:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ai/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s
    
    # Security and performance
    security_opt:
      - no-new-privileges:true
    
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '0.5'
    
    networks:
      - tsa-network

  # ===============================
  # Nginx Reverse Proxy & Load Balancer
  # ===============================
  nginx:
    image: nginx:alpine
    container_name: tsa-nginx
    restart: unless-stopped
    
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
      - ./services/nginx/ssl:/etc/nginx/ssl:ro
    
    depends_on:
      tsa-monolith:
        condition: service_healthy
      tsa-ai:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    # Security
    security_opt:
      - no-new-privileges:true
    
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    
    networks:
      - tsa-network

