services:
  # PostgreSQL Database avec PostGIS 17
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: tsa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - InnovlabG1
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: tsa-redis
    restart: unless-stopped
    # Si REDIS_PASSWORD est vide, Redis démarre sans authentification
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
      else
        redis-server --appendonly yes
      fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - InnovlabG1
    healthcheck:
      test: >
        sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping
        else
          redis-cli ping
        fi
        '
      interval: 10s
      timeout: 5s
      retries: 5

  # AdonisJS Backend API (port interne uniquement)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tsa-backend
    restart: unless-stopped
    environment:
      # Application
      TZ: Africa/Douala
      PORT: 3333
      HOST: 0.0.0.0
      NODE_ENV: production
      APP_KEY: ${APP_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Database PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Email SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}

      # Email Resend (Alternative)
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_DOMAIN: ${MAIL_DOMAIN}

      # URLs
      FRONTEND_URL: ${FRONTEND_URL}
      MAIL_FROM: ${MAIL_FROM}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}

      # AI Service (communication interne Docker)
      FASTAPI_BASE_URL: http://tsa-ai:8000

      # Admin par défaut
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tsa-ai:
        condition: service_started

    networks:
      - InnovlabG1

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3333/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy pour Backend
  nginx-backend:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: tsa-nginx
    restart: unless-stopped
    volumes:
      - nginx_logs:/var/log/nginx
    ports:
      - '${BACKEND_PORT:-30000}:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - InnovlabG1
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # FastAPI AI Service
  tsa-ai:
    build:
      context: ../tsa-ai
      dockerfile: Dockerfile
    container_name: tsa-ai-backend
    restart: unless-stopped
    environment:
      # Application
      APP_NAME: ${AI_APP_NAME:-TSA Contest AI API}
      APP_VERSION: ${AI_APP_VERSION:-1.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${AI_DEBUG:-false}
      LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}

      # Database PostgreSQL (via réseau Docker)
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}

      # Redis (via réseau Docker)
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CACHE_TTL_SECONDS: ${AI_CACHE_TTL:-300}

      # CORS Origins
      ALLOWED_ORIGINS: ${AI_ALLOWED_ORIGINS:-["http://localhost:3000", "http://localhost:5173", "http://localhost:3333"]}

      # ML Models
      MODELS_PATH: ${AI_MODELS_PATH:-ml_models}
      PREDICTION_BATCH_SIZE: ${AI_PREDICTION_BATCH_SIZE:-100}
      MODEL_RELOAD_INTERVAL: ${AI_MODEL_RELOAD_INTERVAL:-3600}

      # Internal service communication
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-internal-secret-key-change-in-production}

    ports:
      - '${AI_PORT:-30002}:8000'

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - InnovlabG1

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/ai/health']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s

# Volumes pour persistance des données
volumes:
  postgres_data:
    name: tsa_postgres_data
  redis_data:
    name: tsa_redis_data
  nginx_logs:
    name: tsa_nginx_logs

# Réseau externe assigné par Portainer
networks:
  InnovlabG1:
    external: true
