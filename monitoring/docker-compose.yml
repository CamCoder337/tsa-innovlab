version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: tsa-prometheus
    ports:
      - "30003:9090"
    volumes:
      - prometheus-data:/prometheus
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    depends_on:
      - cadvisor
      - node-exporter
      - postgres-exporter
      - redis-exporter
      - nginx-exporter
    networks:
      - InnovlabG1
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - 'com.tsa.service=monitoring-prometheus'
      - 'com.tsa.description=Prometheus Metrics Collection & Time Series Database'
      - 'com.tsa.version=latest'

  grafana:
    image: grafana/grafana:latest
    container_name: tsa-grafana
    ports:
      - "30004:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://51.91.77.0:30004}
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - InnovlabG1
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - 'com.tsa.service=monitoring-grafana'
      - 'com.tsa.description=Grafana Metrics Visualization & Dashboards'
      - 'com.tsa.version=latest'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: tsa-cadvisor
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    restart: unless-stopped
    networks:
      - InnovlabG1
    labels:
      - 'com.tsa.service=monitoring-cadvisor'
      - 'com.tsa.description=Container Metrics Exporter (CPU, Memory, Network, I/O)'
      - 'com.tsa.version=latest'

  node-exporter:
    image: prom/node-exporter:latest
    container_name: tsa-node-exporter
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - InnovlabG1
    labels:
      - 'com.tsa.service=monitoring-node-exporter'
      - 'com.tsa.description=Host System Metrics Exporter (CPU, Memory, Disk, Network)'
      - 'com.tsa.version=latest'

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: tsa-postgres-exporter
    expose:
      - "9187"
    environment:
      # Update username, password, and database name
      DATA_SOURCE_NAME: 'postgresql://${DB_USER}:${DB_PASSWORD}@tsa-postgres:5432/${DB_DATABASE}?sslmode=disable'
    restart: unless-stopped
    networks:
      - InnovlabG1
    labels:
      - 'com.tsa.service=monitoring-postgres-exporter'
      - 'com.tsa.description=PostgreSQL Database Metrics Exporter'
      - 'com.tsa.version=latest'

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: tsa-redis-exporter
    expose:
      - "9121"
    environment:
      REDIS_ADDR: "tsa-redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - InnovlabG1
    labels:
      - 'com.tsa.service=monitoring-redis-exporter'
      - 'com.tsa.description=Redis Cache Metrics Exporter'
      - 'com.tsa.version=latest'

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: tsa-nginx-exporter
    expose:
      - "9113"
    command:
      - '-nginx.scrape-uri=http://tsa-nginx:8080/stub_status'
    restart: unless-stopped
    networks:
      - InnovlabG1
    labels:
      - 'com.tsa.service=monitoring-nginx-exporter'
      - 'com.tsa.description=Nginx Web Server Metrics Exporter'
      - 'com.tsa.version=latest'

volumes:
  prometheus-data:
    name: tsa_prometheus_data
  grafana-data:
    name: tsa_grafana_data

networks:
  InnovlabG1:
    external: true

configs:
  prometheus-config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        # Prometheus self-monitoring
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']

        # Docker container metrics
        - job_name: 'cadvisor'
          static_configs:
            - targets: ['tsa-cadvisor:8080']

        # VPS host metrics (CPU, memory, disk, network)
        - job_name: 'node'
          static_configs:
            - targets: ['tsa-node-exporter:9100']

        # PostgreSQL database metrics
        - job_name: 'postgres'
          static_configs:
            - targets: ['tsa-postgres-exporter:9187']

        # Redis cache metrics
        - job_name: 'redis'
          static_configs:
            - targets: ['tsa-redis-exporter:9121']

        # Nginx web server metrics
        - job_name: 'nginx'
          static_configs:
            - targets: ['tsa-nginx-exporter:9113']

        # Adonis backend application (after instrumentation)
        - job_name: 'tsa-backend'
          static_configs:
            - targets: ['tsa-backend:3333']
          metrics_path: '/metrics'

        # FastAPI AI backend (after instrumentation)
        - job_name: 'tsa-ai-backend'
          static_configs:
            - targets: ['tsa-ai-backend:8000']
          metrics_path: '/metrics'

        # React frontend (optional - if you add metrics)
        - job_name: 'frontend'
          static_configs:
            - targets: ['frontend:80']
          metrics_path: '/metrics'