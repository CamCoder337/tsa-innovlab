name: Smart CI Pipeline

on:
  pull_request:
    branches: [ develop ]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      monolith: ${{ steps.changes.outputs.monolith }}
      ai-service: ${{ steps.changes.outputs.ai-service }}
      frontend: ${{ steps.changes.outputs.frontend }}
      nginx: ${{ steps.changes.outputs.nginx }}
      root: ${{ steps.changes.outputs.root }}
      any-service: ${{ steps.check.outputs.any-service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            monolith:
              - 'services/tsa-monolith/**'
              - 'CLAUDE.md'
            ai-service:
              - 'services/tsa-ai/**'
              - 'CLAUDE.md'
            frontend:
              - 'apps/frontend-web/**'
              - 'CLAUDE.md'
            nginx:
              - 'services/nginx/**'
            root:
              - 'docker-compose.yml'
              - '.env.example'
              - 'deploy.sh'
              - 'generate-keys.sh'
              - '.github/workflows/**'

      - name: Check if any service changed
        id: check
        run: |
          if [ "${{ steps.changes.outputs.monolith }}" == "true" ] || \
             [ "${{ steps.changes.outputs.ai-service }}" == "true" ] || \
             [ "${{ steps.changes.outputs.frontend }}" == "true" ] || \
             [ "${{ steps.changes.outputs.root }}" == "true" ]; then
            echo "any-service=true" >> $GITHUB_OUTPUT
          else
            echo "any-service=false" >> $GITHUB_OUTPUT
          fi

      - name: 📊 Changes Summary
        run: |
          echo "### 🔄 Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Changed | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Monolith | ${{ steps.changes.outputs.monolith == 'true' && '✅' || '⏭️' }} | ${{ steps.changes.outputs.monolith == 'true' && 'Will test' || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🤖 AI Service | ${{ steps.changes.outputs.ai-service == 'true' && '✅' || '⏭️' }} | ${{ steps.changes.outputs.ai-service == 'true' && 'Will test' || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎨 Frontend | ${{ steps.changes.outputs.frontend == 'true' && '✅' || '⏭️' }} | ${{ steps.changes.outputs.frontend == 'true' && 'Will test' || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Nginx | ${{ steps.changes.outputs.nginx == 'true' && '✅' || '⏭️' }} | ${{ steps.changes.outputs.nginx == 'true' && 'Will test' || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY

  test-monolith:
    name: 🏗️ Test AdonisJS Monolith
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.monolith == 'true'
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: tsa_password
          POSTGRES_USER: tsa_user
          POSTGRES_DB: tsa_contest
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: services/tsa-monolith

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: services/tsa-monolith/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup environment
        run: |
          cp .env.example .env || echo "No .env.example found, creating basic .env"
          echo "DATABASE_URL=postgres://tsa_user:tsa_password@localhost:5432/tsa_contest" >> .env
          echo "REDIS_HOST=localhost" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "APP_KEY=your-32-character-secret-key-here-test" >> .env
          echo "NODE_ENV=test" >> .env

      - name: Run migrations
        run: node ace migration:run --force

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: 📊 Monolith Test Results
        if: always()
        run: |
          echo "### 🏗️ AdonisJS Monolith Results" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Tests failed!**" >> $GITHUB_STEP_SUMMARY
          fi

  test-ai-service:
    name: 🤖 Test FastAPI AI Service
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ai-service == 'true'
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: tsa_password
          POSTGRES_USER: tsa_user
          POSTGRES_DB: tsa_contest
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: services/tsa-ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: services/tsa-ai/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup environment
        run: |
          echo "DATABASE_URL=postgresql://tsa_user:tsa_password@localhost:5432/tsa_contest" > .env
          echo "REDIS_URL=redis://localhost:6379/0" >> .env
          echo "ENVIRONMENT=test" >> .env

      - name: Run linting
        run: |
          echo "Running code quality checks..."
          flake8 . || echo "Flake8 issues found"
          black --check . || echo "Black formatting issues found"
          isort --check-only . || echo "Import sorting issues found"

      - name: Run tests
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: services/tsa-ai/coverage.xml
          flags: ai-service
          name: codecov-ai-service

      - name: 📊 AI Service Test Results
        if: always()
        run: |
          echo "### 🤖 FastAPI AI Service Results" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Tests failed!**" >> $GITHUB_STEP_SUMMARY
          fi

  test-frontend:
    name: 🎨 Test Frontend Web
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: apps/frontend-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: apps/frontend-web/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linting
        run: yarn lint

      - name: Run format check
        run: yarn format --check || echo "Format issues found (non-blocking)"

      - name: Build project
        run: yarn build

      - name: 📊 Frontend Test Results
        if: always()
        run: |
          echo "### 🎨 Frontend Web Results" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ **Build successful!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build failed!**" >> $GITHUB_STEP_SUMMARY
          fi

  test-nginx:
    name: 🌐 Test Nginx Config
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.nginx == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Nginx configuration
        run: |
          # Install nginx for config testing
          sudo apt-get update
          sudo apt-get install -y nginx
          
          # Test nginx configuration
          if [ -f "services/nginx/nginx.conf" ]; then
            sudo nginx -t -c $(pwd)/services/nginx/nginx.conf
          else
            echo "No nginx.conf found, skipping test"
          fi

      - name: 📊 Nginx Test Results
        if: always()
        run: |
          echo "### 🌐 Nginx Config Results" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ **Configuration valid!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Configuration invalid!**" >> $GITHUB_STEP_SUMMARY
          fi

  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [changes, test-monolith, test-ai-service, test-frontend]
    if: |
      always() && 
      needs.changes.outputs.any-service == 'true' &&
      (needs.test-monolith.result == 'success' || needs.test-monolith.result == 'skipped') &&
      (needs.test-ai-service.result == 'success' || needs.test-ai-service.result == 'skipped') &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create test environment file
        run: |
          cp .env.example .env || echo "Creating basic .env"
          echo "NODE_ENV=production" >> .env
          echo "DATABASE_URL=postgres://tsa_user:tsa_password@postgres:5432/tsa_contest" >> .env

      - name: Build and test with Docker Compose
        run: |
          # Only build services that changed
          SERVICES=""
          
          if [ "${{ needs.changes.outputs.monolith }}" == "true" ]; then
            SERVICES="$SERVICES tsa-monolith"
          fi
          
          if [ "${{ needs.changes.outputs.ai-service }}" == "true" ]; then
            SERVICES="$SERVICES tsa-ai"
          fi
          
          if [ "${{ needs.changes.outputs.nginx }}" == "true" ]; then
            SERVICES="$SERVICES nginx"
          fi
          
          if [ -n "$SERVICES" ]; then
            echo "Building services: $SERVICES"
            docker-compose build $SERVICES
            docker-compose up -d postgres redis
            sleep 10
            docker-compose up -d $SERVICES
            
            # Wait for services to be ready
            timeout 180 bash -c 'until docker-compose ps | grep -q "healthy\|Up"; do sleep 5; done'
            
            # Run health checks only for built services
            if [ "${{ needs.changes.outputs.monolith }}" == "true" ]; then
              curl -f http://localhost:3333/health || echo "Monolith health check failed"
            fi
            
            if [ "${{ needs.changes.outputs.ai-service }}" == "true" ]; then
              curl -f http://localhost:8000/api/ai/health || echo "AI service health check failed"
            fi
            
            if [ "${{ needs.changes.outputs.nginx }}" == "true" ]; then
              curl -f http://localhost/health || echo "Nginx health check failed"
            fi
          else
            echo "No services to test in integration phase"
          fi

      - name: Cleanup
        if: always()
        run: docker-compose down -v

      - name: 📊 Integration Test Results
        if: always()
        run: |
          echo "### 🔗 Integration Test Results" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ **Integration tests passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Integration tests failed!**" >> $GITHUB_STEP_SUMMARY
          fi

  auto-merge:
    name: 🚀 Auto Merge PR
    runs-on: ubuntu-latest
    needs: [integration-tests, changes]
    if: |
      always() &&
      needs.changes.outputs.any-service == 'true' &&
      needs.integration-tests.result == 'success' &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: |
          echo "🎉 All tests passed! Auto-merging PR #${{ github.event.pull_request.number }}"
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Final Summary
        run: |
          echo "### 🎉 CI Pipeline Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All changed services tested" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Integration tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ PR auto-merged" >> $GITHUB_STEP_SUMMARY

  no-changes:
    name: 📝 No Changes Detected
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any-service == 'false'
    
    steps:
      - name: Skip message
        run: |
          echo "### ⏭️ No Service Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "No changes in services detected. Skipping tests." >> $GITHUB_STEP_SUMMARY
          echo "Changes were only in:" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation or configuration files that don't affect services" >> $GITHUB_STEP_SUMMARY