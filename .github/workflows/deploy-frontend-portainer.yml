name: Deploy Frontend to Portainer

on:
  push:
    branches:
      - develop  # Déploiement automatique sur develop
    paths:
      - 'apps/frontend-web/**'  # Seulement si des fichiers du frontend changent

  workflow_dispatch:  # Permet de déclencher manuellement

jobs:
  trigger-portainer-webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Portainer Webhook
        run: |
          curl -X POST "${{ secrets.PORTAINER_FRONTEND_WEBHOOK_URL }}"

      - name: Wait for deployment
        run: sleep 10

      - name: Deployment triggered
        run: |
          echo "✅ Portainer webhook triggered successfully!"
          echo "🚀 Check Portainer for deployment status"
          echo "📍 Frontend should be available on port 30005"
