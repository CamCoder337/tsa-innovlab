name: CD Production Environment

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION || 'us-central1' }}
  SERVICE: tsa-innovlab-prod
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-deploy-prod:
    name: Deploy to GCP Production Environment
    runs-on: ubuntu-latest
    needs: [security-scan]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker to use gcloud as credential helper
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

      - name: Create Artifact Registry repository (if not exists)
        run: |
          gcloud artifacts repositories describe tsa-innovlab \
            --location=$GAR_LOCATION \
            --format="get(name)" || \
          gcloud artifacts repositories create tsa-innovlab \
            --repository-format=docker \
            --location=$GAR_LOCATION \
            --description="TSA InnovLab Docker repository"

      - name: Build and push Docker images with security scan
        run: |
          # Build AdonisJS Monolith
          docker build -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:$GITHUB_SHA \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:latest \
            ./services/tsa-monolith
          
          # Scan for vulnerabilities
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL \
            $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:$GITHUB_SHA
          
          # Push images
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:$GITHUB_SHA
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:latest
          
          # Build FastAPI AI Service
          docker build -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:$GITHUB_SHA \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:latest \
            ./services/tsa-ai
          
          # Scan for vulnerabilities
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL \
            $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:$GITHUB_SHA
          
          # Push images
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:$GITHUB_SHA
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:latest

      - name: Create production Cloud Run configuration
        run: |
          cat <<EOF > cloud-run-prod-config.yaml
          apiVersion: serving.knative.dev/v1
          kind: Service
          metadata:
            name: tsa-monolith-prod
            annotations:
              run.googleapis.com/ingress: all
              run.googleapis.com/execution-environment: gen2
              run.googleapis.com/launch-stage: GA
          spec:
            template:
              metadata:
                annotations:
                  autoscaling.knative.dev/minScale: "2"
                  autoscaling.knative.dev/maxScale: "100"
                  run.googleapis.com/cloudsql-instances: $PROJECT_ID:$REGION:tsa-postgres-prod
                  run.googleapis.com/cpu-throttling: "false"
              spec:
                containerConcurrency: 1000
                timeoutSeconds: 300
                containers:
                - image: $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:$GITHUB_SHA
                  ports:
                  - name: http1
                    containerPort: 3333
                  env:
                  - name: NODE_ENV
                    value: "production"
                  - name: HOST
                    value: "0.0.0.0"
                  - name: PORT
                    value: "3333"
                  - name: DB_HOST
                    value: "/cloudsql/$PROJECT_ID:$REGION:tsa-postgres-prod"
                  - name: DB_PORT
                    value: "5432"
                  - name: DB_USER
                    valueFrom:
                      secretKeyRef:
                        name: db-credentials-prod
                        key: username
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: db-credentials-prod
                        key: password
                  - name: DB_DATABASE
                    value: "tsa_contest_prod"
                  - name: APP_KEY
                    valueFrom:
                      secretKeyRef:
                        name: app-secrets-prod
                        key: app_key
                  - name: REDIS_HOST
                    valueFrom:
                      secretKeyRef:
                        name: redis-config-prod
                        key: host
                  - name: REDIS_PORT
                    value: "6379"
                  - name: REDIS_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: redis-config-prod
                        key: password
                  - name: SESSION_DRIVER
                    value: "redis"
                  resources:
                    limits:
                      cpu: "4"
                      memory: "4Gi"
                    requests:
                      cpu: "2"
                      memory: "2Gi"
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 3333
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 3333
                    initialDelaySeconds: 5
                    periodSeconds: 5
          ---
          apiVersion: serving.knative.dev/v1
          kind: Service
          metadata:
            name: tsa-ai-prod
            annotations:
              run.googleapis.com/ingress: all
              run.googleapis.com/execution-environment: gen2
              run.googleapis.com/launch-stage: GA
          spec:
            template:
              metadata:
                annotations:
                  autoscaling.knative.dev/minScale: "1"
                  autoscaling.knative.dev/maxScale: "50"
                  run.googleapis.com/cloudsql-instances: $PROJECT_ID:$REGION:tsa-postgres-prod
                  run.googleapis.com/cpu-throttling: "false"
              spec:
                containerConcurrency: 1000
                timeoutSeconds: 600
                containers:
                - image: $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:$GITHUB_SHA
                  ports:
                  - name: http1
                    containerPort: 8000
                  env:
                  - name: PYTHONUNBUFFERED
                    value: "1"
                  - name: ENVIRONMENT
                    value: "production"
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: database-url-prod
                        key: url
                  - name: REDIS_URL
                    valueFrom:
                      secretKeyRef:
                        name: redis-url-prod
                        key: url
                  - name: FASTAPI_HOST
                    value: "0.0.0.0"
                  - name: FASTAPI_PORT
                    value: "8000"
                  resources:
                    limits:
                      cpu: "4"
                      memory: "8Gi"
                    requests:
                      cpu: "2"
                      memory: "4Gi"
                  livenessProbe:
                    httpGet:
                      path: /api/ai/health
                      port: 8000
                    initialDelaySeconds: 60
                    periodSeconds: 30
                  readinessProbe:
                    httpGet:
                      path: /api/ai/health
                      port: 8000
                    initialDelaySeconds: 30
                    periodSeconds: 10
          EOF

      - name: Deploy to Cloud Run with blue-green strategy
        run: |
          # Deploy new version with traffic set to 0
          gcloud run services replace cloud-run-prod-config.yaml \
            --region=$REGION \
            --no-traffic
          
          # Get the latest revision
          LATEST_REVISION=$(gcloud run services describe tsa-monolith-prod \
            --region=$REGION \
            --format="value(status.latestRevision)")
          
          # Gradually shift traffic to new revision
          echo "Starting gradual traffic shift..."
          
          # 10% traffic
          gcloud run services update-traffic tsa-monolith-prod \
            --to-revisions=$LATEST_REVISION=10 \
            --region=$REGION
          
          sleep 60
          
          # Health check at 10%
          MONOLITH_URL=$(gcloud run services describe tsa-monolith-prod --region=$REGION --format="value(status.url)")
          curl -f "$MONOLITH_URL/health" || (echo "Health check failed at 10%" && exit 1)
          
          # 50% traffic
          gcloud run services update-traffic tsa-monolith-prod \
            --to-revisions=$LATEST_REVISION=50 \
            --region=$REGION
          
          sleep 120
          
          # Health check at 50%
          curl -f "$MONOLITH_URL/health" || (echo "Health check failed at 50%" && exit 1)
          
          # 100% traffic
          gcloud run services update-traffic tsa-monolith-prod \
            --to-revisions=$LATEST_REVISION=100 \
            --region=$REGION

      - name: Configure custom domain and SSL
        run: |
          # This would typically involve configuring Cloud Load Balancer
          # and SSL certificates for production domains
          echo "Custom domain and SSL configuration would be set up here"

      - name: Allow unauthenticated invocations (production)
        run: |
          gcloud run services add-iam-policy-binding tsa-monolith-prod \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --region=$REGION
          
          gcloud run services add-iam-policy-binding tsa-ai-prod \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --region=$REGION

      - name: Final production health checks
        run: |
          echo "Running comprehensive production health checks..."
          
          MONOLITH_URL=$(gcloud run services describe tsa-monolith-prod --region=$REGION --format="value(status.url)")
          AI_URL=$(gcloud run services describe tsa-ai-prod --region=$REGION --format="value(status.url)")
          
          # Extended health checks
          for i in {1..5}; do
            curl -f "$MONOLITH_URL/health" && echo "Monolith health check $i: OK"
            curl -f "$AI_URL/api/ai/health" && echo "AI service health check $i: OK"
            sleep 10
          done
          
          echo "Production deployment completed successfully!"
          echo "Monolith Service URL: $MONOLITH_URL"
          echo "AI Service URL: $AI_URL"

      - name: Run database migrations (production)
        run: |
          # Create Cloud Run job for migrations
          gcloud run jobs create tsa-db-migration \
            --image=$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:$GITHUB_SHA \
            --region=$REGION \
            --set-cloudsql-instances=$PROJECT_ID:$REGION:tsa-postgres-prod \
            --set-env-vars="NODE_ENV=production" \
            --set-secrets="DB_USER=db-credentials-prod:username,DB_PASSWORD=db-credentials-prod:password" \
            --set-env-vars="DB_DATABASE=tsa_contest_prod,DB_HOST=/cloudsql/$PROJECT_ID:$REGION:tsa-postgres-prod,DB_PORT=5432" \
            --command="node" \
            --args="ace,migration:run,--force" \
            --max-retries=1 \
            --parallelism=1 \
            --memory=1Gi \
            --cpu=1 || echo "Migration job creation skipped (might already exist)"
          
          # Execute migration
          gcloud run jobs execute tsa-db-migration --region=$REGION --wait

  notify-production-deployment:
    name: Notify Production Deployment
    runs-on: ubuntu-latest
    needs: [build-and-deploy-prod]
    if: always()

    steps:
      - name: Notify Success
        if: needs.build-and-deploy-prod.result == 'success'
        run: |
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL! 🎉"
          echo "Version: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Timestamp: $(date -u)"

      - name: Notify Failure
        if: needs.build-and-deploy-prod.result == 'failure'
        run: |
          echo "🚨 PRODUCTION DEPLOYMENT FAILED! 🚨"
          echo "Version: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Please check logs immediately!"
          exit 1

  post-deployment-monitoring:
    name: Post-Deployment Monitoring
    runs-on: ubuntu-latest
    needs: [build-and-deploy-prod]
    if: needs.build-and-deploy-prod.result == 'success'

    steps:
      - name: Setup monitoring alerts
        run: |
          echo "Setting up monitoring and alerting for production deployment..."
          echo "This would typically configure Cloud Monitoring alerts"
          echo "and application performance monitoring (APM)"

      - name: Smoke tests
        run: |
          echo "Running production smoke tests..."
          echo "This would run a suite of critical path tests"
          echo "against the production environment"