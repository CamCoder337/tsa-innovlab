name: Smart CD Production Environment

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION || 'us-central1' }}
  SERVICE: tsa-innovlab-prod
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}

jobs:
  detect-changes:
    name: 🔍 Detect Changes for Production
    runs-on: ubuntu-latest
    outputs:
      monolith: ${{ steps.changes.outputs.monolith }}
      ai-service: ${{ steps.changes.outputs.ai-service }}
      frontend: ${{ steps.changes.outputs.frontend }}
      nginx: ${{ steps.changes.outputs.nginx }}
      any-service: ${{ steps.check.outputs.any-service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          base: ${{ github.event.before }}
          filters: |
            monolith:
              - 'services/tsa-monolith/**'
            ai-service:
              - 'services/tsa-ai/**'
            frontend:
              - 'apps/frontend-web/**'
            nginx:
              - 'services/nginx/**'

      - name: Check if any deployable service changed
        id: check
        run: |
          if [ "${{ steps.changes.outputs.monolith }}" == "true" ] || \
             [ "${{ steps.changes.outputs.ai-service }}" == "true" ] || \
             [ "${{ steps.changes.outputs.nginx }}" == "true" ]; then
            echo "any-service=true" >> $GITHUB_OUTPUT
          else
            echo "any-service=false" >> $GITHUB_OUTPUT
          fi

      - name: 📊 Production Deployment Plan
        run: |
          echo "### 🚀 Production Deployment Plan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔒 Security Note:** All services will undergo security scanning before deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Changed | Action | Strategy |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|---------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Monolith | ${{ steps.changes.outputs.monolith == 'true' && '✅' || '⏭️' }} | ${{ steps.changes.outputs.monolith == 'true' && 'Deploy' || 'Skip' }} | ${{ steps.changes.outputs.monolith == 'true' && 'Blue-Green' || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🤖 AI Service | ${{ steps.changes.outputs.ai-service == 'true' && '✅' || '⏭️' }} | ${{ steps.changes.outputs.ai-service == 'true' && 'Deploy' || 'Skip' }} | ${{ steps.changes.outputs.ai-service == 'true' && 'Blue-Green' || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎨 Frontend | ${{ steps.changes.outputs.frontend == 'true' && '✅' || '⏭️' }} | ${{ steps.changes.outputs.frontend == 'true' && 'Build & CDN' || 'Skip' }} | ${{ steps.changes.outputs.frontend == 'true' && 'Static' || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Nginx | ${{ steps.changes.outputs.nginx == 'true' && '✅' || '⏭️' }} | ${{ steps.changes.outputs.nginx == 'true' && 'Deploy' || 'Skip' }} | ${{ steps.changes.outputs.nginx == 'true' && 'Blue-Green' || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: 🔒 Security Scanning
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-service == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Security scan summary
        run: |
          echo "### 🔒 Security Scan Completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Vulnerability scan completed - check Security tab for details" >> $GITHUB_STEP_SUMMARY

  setup-gcp-prod:
    name: 🔧 Setup GCP Production
    runs-on: ubuntu-latest
    needs: [detect-changes, security-scan]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker to use gcloud as credential helper
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

      - name: Create Artifact Registry repository (if not exists)
        run: |
          gcloud artifacts repositories describe tsa-innovlab \
            --location=$GAR_LOCATION \
            --format="get(name)" || \
          gcloud artifacts repositories create tsa-innovlab \
            --repository-format=docker \
            --location=$GAR_LOCATION \
            --description="TSA InnovLab Docker repository"

  deploy-monolith-prod:
    name: 🏗️ Deploy Monolith to Production
    runs-on: ubuntu-latest
    needs: [detect-changes, setup-gcp-prod]
    if: needs.detect-changes.outputs.monolith == 'true'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

      - name: Build and security scan Monolith
        run: |
          echo "🏗️ Building AdonisJS Monolith for Production..."
          docker build -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:$GITHUB_SHA \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:latest \
            ./services/tsa-monolith
          
          echo "🔍 Running security scan..."
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL \
            $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:$GITHUB_SHA || echo "Security warnings found"

      - name: Push images
        run: |
          echo "📤 Pushing production images..."
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:$GITHUB_SHA
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:latest

      - name: Deploy with Blue-Green strategy
        run: |
          echo "🔄 Starting Blue-Green deployment for Monolith..."
          
          # Deploy new version with 0% traffic
          gcloud run deploy tsa-monolith-prod \
            --image=$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:$GITHUB_SHA \
            --region=$REGION \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=production,HOST=0.0.0.0,PORT=3333" \
            --set-cloudsql-instances=$PROJECT_ID:$REGION:tsa-postgres-prod \
            --memory=4Gi \
            --cpu=2 \
            --min-instances=2 \
            --max-instances=100 \
            --timeout=300 \
            --no-traffic
          
          # Get latest revision
          LATEST_REVISION=$(gcloud run services describe tsa-monolith-prod \
            --region=$REGION --format="value(status.latestRevision)")
          
          echo "🎯 New revision: $LATEST_REVISION"
          
          # Gradual traffic shift
          echo "📈 Shifting 10% traffic..."
          gcloud run services update-traffic tsa-monolith-prod \
            --to-revisions=$LATEST_REVISION=10 --region=$REGION
          
          sleep 60
          
          # Health check at 10%
          MONOLITH_URL=$(gcloud run services describe tsa-monolith-prod --region=$REGION --format="value(status.url)")
          curl -f "$MONOLITH_URL/health" || (echo "❌ Health check failed at 10%" && exit 1)
          
          echo "📈 Shifting 50% traffic..."
          gcloud run services update-traffic tsa-monolith-prod \
            --to-revisions=$LATEST_REVISION=50 --region=$REGION
          
          sleep 120
          curl -f "$MONOLITH_URL/health" || (echo "❌ Health check failed at 50%" && exit 1)
          
          echo "📈 Shifting 100% traffic..."
          gcloud run services update-traffic tsa-monolith-prod \
            --to-revisions=$LATEST_REVISION=100 --region=$REGION

      - name: Run database migrations
        run: |
          echo "🗄️ Running database migrations..."
          gcloud run jobs create tsa-db-migration-$(date +%s) \
            --image=$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:$GITHUB_SHA \
            --region=$REGION \
            --set-cloudsql-instances=$PROJECT_ID:$REGION:tsa-postgres-prod \
            --set-env-vars="NODE_ENV=production" \
            --set-secrets="DB_USER=db-credentials-prod:username,DB_PASSWORD=db-credentials-prod:password" \
            --set-env-vars="DB_DATABASE=tsa_contest_prod,DB_HOST=/cloudsql/$PROJECT_ID:$REGION:tsa-postgres-prod,DB_PORT=5432" \
            --command="node" --args="ace,migration:run,--force" \
            --max-retries=1 --parallelism=1 --memory=1Gi --cpu=1 \
            --execute --wait || echo "Migration completed or job already exists"

      - name: Final health check
        run: |
          MONOLITH_URL=$(gcloud run services describe tsa-monolith-prod --region=$REGION --format="value(status.url)")
          echo "🎉 Monolith deployed successfully: $MONOLITH_URL"
          
          for i in {1..5}; do
            curl -f "$MONOLITH_URL/health" && echo "✅ Health check $i: OK"
            sleep 10
          done

  deploy-ai-service-prod:
    name: 🤖 Deploy AI Service to Production
    runs-on: ubuntu-latest
    needs: [detect-changes, setup-gcp-prod]
    if: needs.detect-changes.outputs.ai-service == 'true'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

      - name: Build and security scan AI Service
        run: |
          echo "🤖 Building FastAPI AI Service for Production..."
          docker build -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:$GITHUB_SHA \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:latest \
            ./services/tsa-ai
          
          echo "🔍 Running security scan..."
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL \
            $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:$GITHUB_SHA || echo "Security warnings found"

      - name: Push images
        run: |
          echo "📤 Pushing production images..."
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:$GITHUB_SHA
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:latest

      - name: Deploy with Blue-Green strategy
        run: |
          echo "🔄 Starting Blue-Green deployment for AI Service..."
          
          # Deploy new version with 0% traffic
          gcloud run deploy tsa-ai-prod \
            --image=$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:$GITHUB_SHA \
            --region=$REGION \
            --allow-unauthenticated \
            --set-env-vars="PYTHONUNBUFFERED=1,ENVIRONMENT=production,FASTAPI_HOST=0.0.0.0,FASTAPI_PORT=8000" \
            --set-cloudsql-instances=$PROJECT_ID:$REGION:tsa-postgres-prod \
            --memory=8Gi \
            --cpu=4 \
            --min-instances=1 \
            --max-instances=50 \
            --timeout=600 \
            --no-traffic
          
          # Get latest revision
          LATEST_REVISION=$(gcloud run services describe tsa-ai-prod \
            --region=$REGION --format="value(status.latestRevision)")
          
          echo "🎯 New revision: $LATEST_REVISION"
          
          # Gradual traffic shift for AI service (more conservative)
          echo "📈 Shifting 5% traffic..."
          gcloud run services update-traffic tsa-ai-prod \
            --to-revisions=$LATEST_REVISION=5 --region=$REGION
          
          sleep 90
          
          # Health check at 5%
          AI_URL=$(gcloud run services describe tsa-ai-prod --region=$REGION --format="value(status.url)")
          curl -f "$AI_URL/api/ai/health" || (echo "❌ Health check failed at 5%" && exit 1)
          
          echo "📈 Shifting 25% traffic..."
          gcloud run services update-traffic tsa-ai-prod \
            --to-revisions=$LATEST_REVISION=25 --region=$REGION
          
          sleep 180
          curl -f "$AI_URL/api/ai/health" || (echo "❌ Health check failed at 25%" && exit 1)
          
          echo "📈 Shifting 100% traffic..."
          gcloud run services update-traffic tsa-ai-prod \
            --to-revisions=$LATEST_REVISION=100 --region=$REGION

      - name: AI Service health verification
        run: |
          AI_URL=$(gcloud run services describe tsa-ai-prod --region=$REGION --format="value(status.url)")
          echo "🎉 AI Service deployed successfully: $AI_URL"
          
          for i in {1..3}; do
            curl -f "$AI_URL/api/ai/health" && echo "✅ AI Health check $i: OK"
            sleep 30
          done

  deploy-nginx-prod:
    name: 🌐 Deploy Nginx to Production
    runs-on: ubuntu-latest
    needs: [detect-changes, setup-gcp-prod]
    if: needs.detect-changes.outputs.nginx == 'true'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

      - name: Build and push Nginx
        run: |
          echo "🌐 Building Nginx for Production..."
          docker build -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-nginx:$GITHUB_SHA \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-nginx:latest \
            ./services/nginx
          
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-nginx:$GITHUB_SHA
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-nginx:latest

      - name: Deploy Nginx
        run: |
          gcloud run deploy tsa-nginx-prod \
            --image=$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-nginx:$GITHUB_SHA \
            --region=$REGION \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=10 \
            --port=80

  build-frontend-prod:
    name: 🎨 Build Frontend for Production
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: apps/frontend-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: apps/frontend-web/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build for production
        run: |
          echo "VITE_API_URL=https://tsa-monolith-prod-XXX.run.app" > .env.production
          echo "VITE_AI_API_URL=https://tsa-ai-prod-XXX.run.app" >> .env.production
          yarn build

      - name: Upload to Google Cloud Storage
        run: |
          echo "🚀 Deploying frontend to CDN would happen here"
          echo "This would typically involve uploading to Cloud Storage and configuring CDN"

      - name: Frontend deployment summary
        run: |
          echo "### 🎨 Frontend Production Build" >> $GITHUB_STEP_SUMMARY
          echo "✅ Production build completed" >> $GITHUB_STEP_SUMMARY
          echo "📦 Ready for CDN deployment" >> $GITHUB_STEP_SUMMARY

  post-deployment-verification:
    name: 🔍 Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: [deploy-monolith-prod, deploy-ai-service-prod, deploy-nginx-prod, build-frontend-prod, detect-changes]
    if: |
      always() && 
      needs.detect-changes.outputs.any-service == 'true' &&
      (needs.deploy-monolith-prod.result == 'success' || needs.deploy-monolith-prod.result == 'skipped') &&
      (needs.deploy-ai-service-prod.result == 'success' || needs.deploy-ai-service-prod.result == 'skipped') &&
      (needs.deploy-nginx-prod.result == 'success' || needs.deploy-nginx-prod.result == 'skipped')

    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Comprehensive production health checks
        run: |
          echo "🔍 Running comprehensive production verification..."
          
          FAILED=0
          
          if [ "${{ needs.detect-changes.outputs.monolith }}" == "true" ]; then
            MONOLITH_URL=$(gcloud run services describe tsa-monolith-prod --region=${{ env.REGION }} --format="value(status.url)" 2>/dev/null || echo "")
            if [ -n "$MONOLITH_URL" ]; then
              echo "🏗️ Testing Production Monolith: $MONOLITH_URL"
              for i in {1..3}; do
                curl -f "$MONOLITH_URL/health" || FAILED=1
                sleep 10
              done
            fi
          fi
          
          if [ "${{ needs.detect-changes.outputs.ai-service }}" == "true" ]; then
            AI_URL=$(gcloud run services describe tsa-ai-prod --region=${{ env.REGION }} --format="value(status.url)" 2>/dev/null || echo "")
            if [ -n "$AI_URL" ]; then
              echo "🤖 Testing Production AI Service: $AI_URL"
              for i in {1..3}; do
                curl -f "$AI_URL/api/ai/health" || FAILED=1
                sleep 15
              done
            fi
          fi
          
          if [ $FAILED -eq 1 ]; then
            echo "❌ Production verification failed!"
            exit 1
          else
            echo "✅ Production verification successful!"
          fi

      - name: 📊 Production Deployment Summary
        if: always()
        run: |
          echo "### 🎉 Production Deployment Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🚀 Deployed Services:**" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.detect-changes.outputs.monolith }}" == "true" ]; then
            MONOLITH_URL=$(gcloud run services describe tsa-monolith-prod --region=${{ env.REGION }} --format="value(status.url)" 2>/dev/null || echo "N/A")
            echo "- 🏗️ **Monolith**: [$MONOLITH_URL]($MONOLITH_URL)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.detect-changes.outputs.ai-service }}" == "true" ]; then
            AI_URL=$(gcloud run services describe tsa-ai-prod --region=${{ env.REGION }} --format="value(status.url)" 2>/dev/null || echo "N/A")
            echo "- 🤖 **AI Service**: [$AI_URL]($AI_URL)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
            echo "- 🎨 **Frontend**: Production build deployed to CDN" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**📈 Deployment Strategy:** Blue-Green with gradual traffic shift" >> $GITHUB_STEP_SUMMARY
          echo "**🔒 Security:** All images scanned for vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "**⏰ Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY

  no-production-deployment:
    name: ⏭️ No Production Deployment Needed
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-service == 'false'

    steps:
      - name: Skip message
        run: |
          echo "### ⏭️ No Production Deployment Required" >> $GITHUB_STEP_SUMMARY
          echo "No changes in deployable services detected." >> $GITHUB_STEP_SUMMARY
          echo "Only documentation or configuration files were modified." >> $GITHUB_STEP_SUMMARY