name: 🧪 CI - Pull Request Tests

on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_MONOLITH: ${{ github.repository }}/tsa-monolith
  IMAGE_NAME_AI: ${{ github.repository }}/tsa-ai
  IMAGE_NAME_NGINX: ${{ github.repository }}/tsa-nginx

jobs:
  # Job 1: Static Analysis & Linting
  lint-and-analyze:
    name: 🔍 Lint & Static Analysis
    runs-on: ubuntu-latest
    outputs:
      should-continue: ${{ steps.changes.outputs.any-changed == 'true' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        uses: tj-actions/changed-files@v42
        id: changes
        with:
          files: |
            services/**
            .github/workflows/**
            docker-compose.yml
            *.sh
          files_ignore: |
            **/*.md
            **/*.txt

      - name: Setup Node.js
        if: steps.changes.outputs.any-changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'services/tsa-monolith/package-lock.json'

      - name: Setup Python
        if: steps.changes.outputs.any-changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/tsa-ai/requirements.txt'

      # AdonisJS Linting
      - name: Install AdonisJS dependencies
        if: steps.changes.outputs.any-changed == 'true'
        working-directory: services/tsa-monolith
        run: npm ci

      - name: Run AdonisJS linting
        if: steps.changes.outputs.any-changed == 'true'
        working-directory: services/tsa-monolith
        run: |
          npm run lint
          npm run typecheck

      # Python Linting
      - name: Install Python dependencies
        if: steps.changes.outputs.any-changed == 'true'
        working-directory: services/tsa-ai
        run: |
          pip install -r requirements.txt

      - name: Run Python linting
        if: steps.changes.outputs.any-changed == 'true'
        working-directory: services/tsa-ai
        run: |
          black --check .
          isort --check-only .
          flake8 .

      # Security scanning
      - name: Run security audit (Node.js)
        if: steps.changes.outputs.any-changed == 'true'
        working-directory: services/tsa-monolith
        run: npm audit --audit-level moderate

      - name: Run security check (Python)
        if: steps.changes.outputs.any-changed == 'true'
        working-directory: services/tsa-ai
        run: |
          pip install safety
          safety check

  # Job 2: Build Docker Images
  build-images:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-analyze
    if: needs.lint-and-analyze.outputs.should-continue == 'true'
    
    strategy:
      matrix:
        service: [tsa-monolith, tsa-ai, nginx]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=pr-${{ github.event.number }}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # Job 3: Integration Tests
  integration-tests:
    name: 🧪 Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-analyze, build-images]
    if: needs.lint-and-analyze.outputs.should-continue == 'true'
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tsa_contest_test
          POSTGRES_USER: tsa_test_user
          POSTGRES_PASSWORD: tsa_test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Test AdonisJS
      - name: Setup Node.js for tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'services/tsa-monolith/package-lock.json'

      - name: Install AdonisJS dependencies
        working-directory: services/tsa-monolith
        run: npm ci

      - name: Run AdonisJS migrations (test DB)
        working-directory: services/tsa-monolith
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: tsa_test_user
          DB_PASSWORD: tsa_test_password
          DB_DATABASE: tsa_contest_test
          NODE_ENV: test
          APP_KEY: test-key-32-characters-long-xxx
        run: |
          npm run build
          node ace migration:run --force

      - name: Run AdonisJS tests
        working-directory: services/tsa-monolith
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: tsa_test_user
          DB_PASSWORD: tsa_test_password
          DB_DATABASE: tsa_contest_test
          NODE_ENV: test
          APP_KEY: test-key-32-characters-long-xxx
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm test

      # Test FastAPI
      - name: Setup Python for tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/tsa-ai/requirements.txt'

      - name: Install Python dependencies
        working-directory: services/tsa-ai
        run: |
          pip install -r requirements.txt
          pip install pytest-cov httpx

      - name: Run FastAPI tests
        working-directory: services/tsa-ai
        env:
          DATABASE_URL: postgresql://tsa_test_user:tsa_test_password@localhost:5432/tsa_contest_test
          REDIS_URL: redis://localhost:6379/1
          ENVIRONMENT: test
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./services/tsa-ai/coverage.xml
          flags: fastapi-tests
          name: codecov-umbrella

  # Job 4: End-to-End Tests
  e2e-tests:
    name: 🎯 End-to-End Tests
    runs-on: ubuntu-latest
    needs: [lint-and-analyze, build-images]
    if: needs.lint-and-analyze.outputs.should-continue == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test environment file
        run: |
          cat > .env.test << EOF
          POSTGRES_DB=tsa_contest_test
          POSTGRES_USER=tsa_test_user
          POSTGRES_PASSWORD=tsa_test_password
          REDIS_PASSWORD=tsa_redis_test_password
          APP_KEY=test-key-32-characters-long-xxxxx
          NODE_ENV=test
          ENVIRONMENT=test
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create test docker-compose
        run: |
          # Use the built images from registry
          sed 's|build:|# build:|g; s|context: ./services/\([^/]*\)|image: ${{ env.REGISTRY }}/${{ github.repository }}/\1:pr-${{ github.event.number }}-${{ github.sha }}|g' docker-compose.yml > docker-compose.test.yml
          
          # Update environment variables for test
          sed -i 's/tsa_password/tsa_test_password/g; s/tsa_redis_password/tsa_redis_test_password/g; s/tsa_contest/tsa_contest_test/g' docker-compose.test.yml

      - name: Start test environment
        run: |
          docker-compose -f docker-compose.test.yml --env-file .env.test up -d
          
          # Wait for services to be healthy
          timeout 300 bash -c '
            until docker-compose -f docker-compose.test.yml ps | grep -E "(healthy|Up).*tsa-nginx"; do
              echo "Waiting for services to be ready..."
              sleep 10
            done
          '

      - name: Run E2E health checks
        run: |
          # Wait a bit more for services to settle
          sleep 30
          
          # Test main endpoints
          curl -f http://localhost/health || exit 1
          curl -f http://localhost/api/ai/health || exit 1
          
          # Test API endpoints (basic smoke tests)
          curl -f -X GET http://localhost/api/ai/docs || exit 1

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Services ==="
          docker-compose -f docker-compose.test.yml ps
          echo "=== Nginx Logs ==="
          docker-compose -f docker-compose.test.yml logs nginx
          echo "=== Monolith Logs ==="
          docker-compose -f docker-compose.test.yml logs tsa-monolith
          echo "=== AI Service Logs ==="
          docker-compose -f docker-compose.test.yml logs tsa-ai

      - name: Cleanup test environment
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down -v

  # Job 5: Security Scanning
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: build-images
    if: needs.lint-and-analyze.outputs.should-continue == 'true'
    
    strategy:
      matrix:
        service: [tsa-monolith, tsa-ai, nginx]
    
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:pr-${{ github.event.number }}-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'

  # Job 6: Auto-merge PR if all tests pass
  auto-merge:
    name: 🤖 Auto-merge PR
    runs-on: ubuntu-latest
    needs: [integration-tests, e2e-tests, security-scan]
    if: |
      github.event_name == 'pull_request' &&
      success() &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge') &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if PR is mergeable
        id: mergeable
        run: |
          # Check if PR has conflicts
          gh pr view ${{ github.event.pull_request.number }} --json mergeable -q '.mergeable'
          mergeable=$(gh pr view ${{ github.event.pull_request.number }} --json mergeable -q '.mergeable')
          
          if [ "$mergeable" = "MERGEABLE" ]; then
            echo "can-merge=true" >> $GITHUB_OUTPUT
          else
            echo "can-merge=false" >> $GITHUB_OUTPUT
            echo "PR is not mergeable due to conflicts or other issues"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.mergeable.outputs.can-merge == 'true'
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash --delete-branch
          echo "✅ Auto-merge enabled for PR #${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add comment on successful merge setup
        if: steps.mergeable.outputs.can-merge == 'true'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "🤖 **Auto-merge enabled!** 
          
          ✅ All tests passed successfully
          ✅ Security scans completed
          ✅ No merge conflicts detected
          
          This PR will be automatically merged when all required status checks pass."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add comment if cannot merge
        if: steps.mergeable.outputs.can-merge == 'false'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "⚠️ **Auto-merge failed**
          
          The PR cannot be automatically merged due to:
          - Merge conflicts
          - Required status checks pending
          - Branch protection rules
          
          Please resolve any conflicts and ensure all checks pass."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 7: Notification
  notify:
    name: 📢 Notify Results
    runs-on: ubuntu-latest
    needs: [integration-tests, e2e-tests, security-scan, auto-merge]
    if: always()
    
    steps:
      - name: Notify success
        if: contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure')
        run: |
          echo "🎉 All CI checks passed successfully!"
          echo "✅ Linting and static analysis"
          echo "✅ Docker image builds" 
          echo "✅ Integration tests"
          echo "✅ End-to-end tests"
          echo "✅ Security scans"

      - name: Notify failure
        if: contains(needs.*.result, 'failure')
        run: |
          echo "❌ Some CI checks failed!"
          echo "Please check the failed jobs and fix the issues."
          exit 1