name: CI Pipeline

on:
  pull_request:
    branches: [ develop ]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  test-monolith:
    name: Test AdonisJS Monolith
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: tsa_password
          POSTGRES_USER: tsa_user
          POSTGRES_DB: tsa_contest
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: services/tsa-monolith

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: services/tsa-monolith/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup environment
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgres://tsa_user:tsa_password@localhost:5432/tsa_contest" >> .env
          echo "REDIS_HOST=localhost" >> .env
          echo "REDIS_PORT=6379" >> .env

      - name: Run migrations
        run: node ace migration:run

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

  test-ai-service:
    name: Test FastAPI AI Service
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: tsa_password
          POSTGRES_USER: tsa_user
          POSTGRES_DB: tsa_contest
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: services/tsa-ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: services/tsa-ai/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup environment
        run: |
          echo "DATABASE_URL=postgresql://tsa_user:tsa_password@localhost:5432/tsa_contest" > .env
          echo "REDIS_URL=redis://localhost:6379/0" >> .env
          echo "ENVIRONMENT=test" >> .env

      - name: Run linting
        run: |
          flake8 .
          black --check .
          isort --check-only .

      - name: Run tests
        run: pytest tests/ --cov=app --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: services/tsa-ai/coverage.xml
          flags: ai-service
          name: codecov-ai-service

  test-frontend:
    name: Test Frontend Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: apps/frontend-web/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linting
        run: yarn lint

      - name: Run format check
        run: yarn format --check

      - name: Build project
        run: yarn build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-monolith, test-ai-service, test-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test with Docker Compose
        run: |
          cp .env.example .env
          docker-compose -f docker-compose.yml up --build -d
          
          # Wait for services to be healthy
          timeout 300 bash -c 'until docker-compose ps | grep -q "healthy"; do sleep 5; done'
          
          # Run health checks
          curl -f http://localhost:3333/health
          curl -f http://localhost:8000/api/ai/health
          curl -f http://localhost/health

      - name: Cleanup
        if: always()
        run: docker-compose down -v

  auto-merge:
    name: Auto Merge PR
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.event.pull_request.user.login != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}