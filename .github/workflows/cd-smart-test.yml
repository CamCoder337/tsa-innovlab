name: Smart CD Test Environment

on:
  push:
    branches: [ develop ]
  workflow_run:
    workflows: ["Smart CI Pipeline"]
    types: [completed]
    branches: [ develop ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION || 'us-central1' }}
  SERVICE: tsa-innovlab-test
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}

jobs:
  detect-changes:
    name: 🔍 Detect Changes for Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success')
    outputs:
      monolith: ${{ steps.changes.outputs.monolith }}
      ai-service: ${{ steps.changes.outputs.ai-service }}
      frontend: ${{ steps.changes.outputs.frontend }}
      nginx: ${{ steps.changes.outputs.nginx }}
      any-service: ${{ steps.check.outputs.any-service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          base: ${{ github.event.before }}
          filters: |
            monolith:
              - 'services/tsa-monolith/**'
            ai-service:
              - 'services/tsa-ai/**'
            frontend:
              - 'apps/frontend-web/**'
            nginx:
              - 'services/nginx/**'

      - name: Check if any deployable service changed
        id: check
        run: |
          if [ "${{ steps.changes.outputs.monolith }}" == "true" ] || \
             [ "${{ steps.changes.outputs.ai-service }}" == "true" ] || \
             [ "${{ steps.changes.outputs.nginx }}" == "true" ]; then
            echo "any-service=true" >> $GITHUB_OUTPUT
          else
            echo "any-service=false" >> $GITHUB_OUTPUT
          fi

      - name: 📊 Deployment Plan
        run: |
          echo "### 🚀 Test Environment Deployment Plan" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Changed | Action |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Monolith | ${{ steps.changes.outputs.monolith == 'true' && '✅' || '⏭️' }} | ${{ steps.changes.outputs.monolith == 'true' && 'Deploy' || 'Skip' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🤖 AI Service | ${{ steps.changes.outputs.ai-service == 'true' && '✅' || '⏭️' }} | ${{ steps.changes.outputs.ai-service == 'true' && 'Deploy' || 'Skip' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎨 Frontend | ${{ steps.changes.outputs.frontend == 'true' && '✅' || '⏭️' }} | ${{ steps.changes.outputs.frontend == 'true' && 'Build only' || 'Skip' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Nginx | ${{ steps.changes.outputs.nginx == 'true' && '✅' || '⏭️' }} | ${{ steps.changes.outputs.nginx == 'true' && 'Deploy' || 'Skip' }} |" >> $GITHUB_STEP_SUMMARY

  setup-gcp:
    name: 🔧 Setup GCP
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-service == 'true'
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker to use gcloud as credential helper
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

      - name: Create Artifact Registry repository (if not exists)
        run: |
          gcloud artifacts repositories describe tsa-innovlab \
            --location=$GAR_LOCATION \
            --format="get(name)" || \
          gcloud artifacts repositories create tsa-innovlab \
            --repository-format=docker \
            --location=$GAR_LOCATION \
            --description="TSA InnovLab Docker repository"

  deploy-monolith:
    name: 🏗️ Deploy Monolith
    runs-on: ubuntu-latest
    needs: [detect-changes, setup-gcp]
    if: needs.detect-changes.outputs.monolith == 'true'
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

      - name: Build and push Monolith
        run: |
          echo "🏗️ Building AdonisJS Monolith..."
          docker build -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:$GITHUB_SHA \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:latest-test \
            ./services/tsa-monolith
          
          echo "📤 Pushing images..."
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:$GITHUB_SHA
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:latest-test

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy tsa-monolith-test \
            --image=$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-monolith:$GITHUB_SHA \
            --region=$REGION \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=production,HOST=0.0.0.0,PORT=3333" \
            --set-cloudsql-instances=$PROJECT_ID:$REGION:tsa-postgres-test \
            --memory=2Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --timeout=300

      - name: Health check
        run: |
          MONOLITH_URL=$(gcloud run services describe tsa-monolith-test --region=$REGION --format="value(status.url)")
          echo "🏗️ Monolith URL: $MONOLITH_URL"
          sleep 30
          curl -f "$MONOLITH_URL/health" || echo "Health check failed (non-critical)"

  deploy-ai-service:
    name: 🤖 Deploy AI Service
    runs-on: ubuntu-latest
    needs: [detect-changes, setup-gcp]
    if: needs.detect-changes.outputs.ai-service == 'true'
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

      - name: Build and push AI Service
        run: |
          echo "🤖 Building FastAPI AI Service..."
          docker build -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:$GITHUB_SHA \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:latest-test \
            ./services/tsa-ai
          
          echo "📤 Pushing images..."
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:$GITHUB_SHA
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:latest-test

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy tsa-ai-test \
            --image=$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-ai:$GITHUB_SHA \
            --region=$REGION \
            --allow-unauthenticated \
            --set-env-vars="PYTHONUNBUFFERED=1,ENVIRONMENT=test,FASTAPI_HOST=0.0.0.0,FASTAPI_PORT=8000" \
            --set-cloudsql-instances=$PROJECT_ID:$REGION:tsa-postgres-test \
            --memory=4Gi \
            --cpu=2 \
            --min-instances=0 \
            --max-instances=5 \
            --timeout=600

      - name: Health check
        run: |
          AI_URL=$(gcloud run services describe tsa-ai-test --region=$REGION --format="value(status.url)")
          echo "🤖 AI Service URL: $AI_URL"
          sleep 60
          curl -f "$AI_URL/api/ai/health" || echo "Health check failed (non-critical)"

  build-frontend:
    name: 🎨 Build Frontend (Static)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: apps/frontend-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: apps/frontend-web/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build for test environment
        run: |
          echo "VITE_API_URL=https://tsa-monolith-test-XXX.run.app" > .env.production
          echo "VITE_AI_API_URL=https://tsa-ai-test-XXX.run.app" >> .env.production
          yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-dist
          path: apps/frontend-web/dist/
          retention-days: 1

      - name: 📊 Frontend Build Summary
        run: |
          echo "### 🎨 Frontend Build Completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Static assets built and ready for CDN deployment" >> $GITHUB_STEP_SUMMARY

  deploy-nginx:
    name: 🌐 Deploy Nginx
    runs-on: ubuntu-latest
    needs: [detect-changes, setup-gcp]
    if: needs.detect-changes.outputs.nginx == 'true'
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

      - name: Build and push Nginx
        run: |
          echo "🌐 Building Nginx..."
          docker build -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-nginx:$GITHUB_SHA \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-nginx:latest-test \
            ./services/nginx
          
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-nginx:$GITHUB_SHA
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-nginx:latest-test

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy tsa-nginx-test \
            --image=$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/tsa-innovlab/tsa-nginx:$GITHUB_SHA \
            --region=$REGION \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=0.5 \
            --min-instances=0 \
            --max-instances=3 \
            --port=80

  integration-health-check:
    name: 🔗 Integration Health Check
    runs-on: ubuntu-latest
    needs: [deploy-monolith, deploy-ai-service, deploy-nginx, build-frontend, detect-changes]
    if: |
      always() && 
      needs.detect-changes.outputs.any-service == 'true' &&
      (needs.deploy-monolith.result == 'success' || needs.deploy-monolith.result == 'skipped') &&
      (needs.deploy-ai-service.result == 'success' || needs.deploy-ai-service.result == 'skipped') &&
      (needs.deploy-nginx.result == 'success' || needs.deploy-nginx.result == 'skipped')

    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Run integration health checks
        run: |
          echo "🔗 Running integration health checks..."
          
          FAILED=0
          
          if [ "${{ needs.detect-changes.outputs.monolith }}" == "true" ]; then
            MONOLITH_URL=$(gcloud run services describe tsa-monolith-test --region=${{ env.REGION }} --format="value(status.url)" 2>/dev/null || echo "")
            if [ -n "$MONOLITH_URL" ]; then
              echo "Testing Monolith: $MONOLITH_URL"
              curl -f "$MONOLITH_URL/health" || FAILED=1
            fi
          fi
          
          if [ "${{ needs.detect-changes.outputs.ai-service }}" == "true" ]; then
            AI_URL=$(gcloud run services describe tsa-ai-test --region=${{ env.REGION }} --format="value(status.url)" 2>/dev/null || echo "")
            if [ -n "$AI_URL" ]; then
              echo "Testing AI Service: $AI_URL"
              curl -f "$AI_URL/api/ai/health" || FAILED=1
            fi
          fi
          
          if [ $FAILED -eq 1 ]; then
            echo "❌ Some health checks failed"
            exit 1
          else
            echo "✅ All health checks passed"
          fi

      - name: 📊 Deployment Summary
        if: always()
        run: |
          echo "### 🎉 Test Environment Deployment Completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed Services:**" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.detect-changes.outputs.monolith }}" == "true" ]; then
            MONOLITH_URL=$(gcloud run services describe tsa-monolith-test --region=${{ env.REGION }} --format="value(status.url)" 2>/dev/null || echo "N/A")
            echo "- 🏗️ Monolith: [$MONOLITH_URL]($MONOLITH_URL)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.detect-changes.outputs.ai-service }}" == "true" ]; then
            AI_URL=$(gcloud run services describe tsa-ai-test --region=${{ env.REGION }} --format="value(status.url)" 2>/dev/null || echo "N/A")
            echo "- 🤖 AI Service: [$AI_URL]($AI_URL)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
            echo "- 🎨 Frontend: Built and ready for CDN" >> $GITHUB_STEP_SUMMARY
          fi

  no-deployment-needed:
    name: ⏭️ No Deployment Needed
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-service == 'false'

    steps:
      - name: Skip message
        run: |
          echo "### ⏭️ No Deployment Required" >> $GITHUB_STEP_SUMMARY
          echo "No changes in deployable services detected." >> $GITHUB_STEP_SUMMARY
          echo "Only documentation or non-deployable files were modified." >> $GITHUB_STEP_SUMMARY