name: 🚛 CI - Monolith AdonisJS Service (Develop)

on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ develop ]

permissions:
  contents: write
  pull-requests: write
  issues: write
  repository-projects: write

jobs:
  # Job 1: Check if monolith has changes
  check-changes:
    name: 📁 Check Monolith Changes
    runs-on: ubuntu-latest
    outputs:
      monolith-changed: ${{ steps.changes.outputs.any_changed }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for monolith changes
        uses: tj-actions/changed-files@v42
        id: changes
        with:
          files: |
            services/tsa-monolith/**
          files_ignore: |
            services/tsa-monolith/**/*.md
            services/tsa-monolith/**/*.txt

      - name: Display result and debug
        run: |
          echo "🔍 DEBUG: Checking tj-actions outputs..."  
          echo "any_changed value: '${{ steps.changes.outputs.any_changed }}'"
          echo "all_changed_files: '${{ steps.changes.outputs.all_changed_files }}'"
          echo "changed_files: '${{ steps.changes.outputs.changed_files }}'"
          echo ""
          
          if [ "${{ steps.changes.outputs.any_changed }}" = "true" ]; then
            echo "✅ Changes detected in services/tsa-monolith/"
            echo "Files changed: ${{ steps.changes.outputs.all_changed_files }}"
          else
            echo "ℹ️ No changes detected in services/tsa-monolith/"
          fi
          
          echo ""
          echo "🎯 Final output that will be used by other jobs:"
          echo "monolith-changed will be: '${{ steps.changes.outputs.any_changed }}'"

  # Job 2: Lint and TypeCheck
  lint-and-typecheck:
    name: 🔍 Lint & TypeCheck
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.monolith-changed == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'services/tsa-monolith/package-lock.json'

      - name: Install dependencies
        working-directory: services/tsa-monolith
        run: npm ci

      - name: Run ESLint
        working-directory: services/tsa-monolith
        run: |
          echo "🔍 Running ESLint..."
          npm run lint

      - name: Run TypeScript check
        working-directory: services/tsa-monolith
        run: |
          echo "🔧 Running TypeScript check..."
          npm run typecheck

  # Job 3: Security Analysis
  security-analysis:
    name: 🛡️ Security Analysis
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.monolith-changed == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'services/tsa-monolith/package-lock.json'

      - name: Install dependencies
        working-directory: services/tsa-monolith
        run: npm ci

      - name: Run npm audit (moderate level)
        working-directory: services/tsa-monolith
        run: |
          echo "🔍 Running security audit..."
          
          # Run audit and capture result
          if npm audit --audit-level moderate; then
            echo "✅ No moderate+ vulnerabilities found"
          else
            audit_exit_code=$?
            echo "⚠️ Security audit found issues (exit code: $audit_exit_code)"
            
            # Get detailed audit info if available
            npm audit --json > audit_report.json 2>/dev/null || echo '{}' > audit_report.json
            
            # Try to extract vulnerability counts using jq if available
            if command -v jq >/dev/null 2>&1; then
              moderate=$(jq -r '.metadata.vulnerabilities.moderate // 0' audit_report.json)
              high=$(jq -r '.metadata.vulnerabilities.high // 0' audit_report.json)
              critical=$(jq -r '.metadata.vulnerabilities.critical // 0' audit_report.json)
              
              echo "📊 Vulnerability Summary:"
              echo "  - Moderate: $moderate"
              echo "  - High: $high"
              echo "  - Critical: $critical"
              
              # Only fail for high/critical vulnerabilities
              if [ "$high" -gt 0 ] || [ "$critical" -gt 0 ]; then
                echo "❌ FAIL: High or critical vulnerabilities detected!"
                echo "🔧 Please run 'npm audit fix' to resolve issues."
                exit 1
              else
                echo "✅ PASS: Only low/moderate vulnerabilities (acceptable for this CI)"
              fi
            else
              # Fallback: accept moderate vulnerabilities, fail on likely high/critical
              if [ "$audit_exit_code" -eq 1 ]; then
                echo "✅ PASS: Moderate vulnerabilities detected but acceptable"
              else
                echo "❌ FAIL: Likely high/critical vulnerabilities detected"
                exit 1
              fi
            fi
          fi

  # Job 4: Run Tests
  run-tests:
    name: 🧪 Run Tests (70%+ Success Required)
    runs-on: ubuntu-latest
    needs: [check-changes, lint-and-typecheck, security-analysis]
    if: needs.check-changes.outputs.monolith-changed == 'true'
    
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: tsa_contest_test
          POSTGRES_USER: tsa_test_user
          POSTGRES_PASSWORD: tsa_test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'services/tsa-monolith/package-lock.json'

      - name: Install dependencies
        working-directory: services/tsa-monolith
        run: npm ci

      - name: Build application
        working-directory: services/tsa-monolith
        run: |
          echo "🔨 Building AdonisJS application..."
          npm run build

      - name: Run database migrations
        working-directory: services/tsa-monolith
        env:
          # Database
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: tsa_test_user
          DB_PASSWORD: tsa_test_password
          DB_DATABASE: tsa_contest_test
          # App config
          NODE_ENV: test
          APP_KEY: test-key-32-characters-long-xxx
          PORT: 3333
          HOST: localhost
          LOG_LEVEL: info
          # Redis
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # Email (dummy values for tests)
          SMTP_HOST: smtp.example.com
          SMTP_PORT: 587
          SMTP_USERNAME: test@example.com
          SMTP_PASSWORD: test_password
          MAIL_FROM: test@example.com
          # Frontend
          FRONTEND_URL: http://localhost:5173
        run: |
          echo "🗄️ Running database migrations..."
          node ace migration:run --force

      - name: Run tests with success rate validation
        working-directory: services/tsa-monolith
        env:
          # Database
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: tsa_test_user
          DB_PASSWORD: tsa_test_password
          DB_DATABASE: tsa_contest_test
          # App config
          NODE_ENV: test
          APP_KEY: test-key-32-characters-long-xxx
          PORT: 3333
          HOST: localhost
          LOG_LEVEL: info
          # Redis
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # Email (dummy values for tests)
          SMTP_HOST: smtp.example.com
          SMTP_PORT: 587
          SMTP_USERNAME: test@example.com
          SMTP_PASSWORD: test_password
          MAIL_FROM: test@example.com
          # Frontend
          FRONTEND_URL: http://localhost:5173
        run: |
          echo "🧪 Running AdonisJS tests with Japa framework..."
          
          # Run tests and capture output
          test_output=$(npm test 2>&1)
          test_exit_code=$?
          
          echo "$test_output"
          echo ""
          
          # Analyze test results
          if echo "$test_output" | grep -q "PASSED"; then
            echo "✅ Test suite completed successfully"
            
            # Try to extract test statistics from Japa output
            # Format example: "Tests  72 passed (72)" or "Tests  70 passed (72)"
            if echo "$test_output" | grep -q "Tests.*passed"; then
              # Extract passed and total counts
              test_line=$(echo "$test_output" | grep "Tests.*passed" | tail -1)
              passed_tests=$(echo "$test_line" | sed -n 's/.*Tests[[:space:]]\+\([0-9]\+\)[[:space:]]\+passed.*/\1/p')
              total_tests=$(echo "$test_line" | sed -n 's/.*passed[[:space:]]*(\([0-9]\+\)).*/\1/p')
              
              if [ -n "$passed_tests" ] && [ -n "$total_tests" ] && [ "$total_tests" -gt 0 ]; then
                # Calculate success percentage
                success_rate=$(echo "scale=2; $passed_tests * 100 / $total_tests" | bc -l)
                
                echo "📊 Test Results Summary:"
                echo "  - Passed: $passed_tests/$total_tests tests"
                echo "  - Success Rate: ${success_rate}%"
                echo "  - Required Minimum: 70%"
                
                # Validate 70% minimum success rate
                if [ $(echo "$success_rate >= 70" | bc -l) -eq 1 ]; then
                  echo "✅ PASS: Test success rate meets requirement (≥70%)"
                else
                  echo "❌ FAIL: Test success rate below requirement"
                  echo "Current: ${success_rate}% | Required: ≥70%"
                  exit 1
                fi
              else
                # Fallback: if we can't parse but tests passed, assume 100%
                echo "📊 Test parsing fallback: All tests appear to have passed"
                echo "✅ PASS: Test suite completed without failures"
              fi
            else
              echo "✅ PASS: Test suite completed successfully (parsing not available)"
            fi
          else
            echo "❌ FAIL: Test suite failed or encountered errors"
            echo "Exit code: $test_exit_code"
            exit $test_exit_code
          fi

  # Job 5: Auto-merge PR
  auto-merge:
    name: 🤖 Auto-merge PR
    runs-on: ubuntu-latest
    needs: [check-changes, lint-and-typecheck, security-analysis, run-tests]
    if: |
      github.event_name == 'pull_request' &&
      needs.check-changes.outputs.monolith-changed == 'true' &&
      success() &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        id: auto-merge
        run: |
          echo "🤖 Enabling auto-merge for PR #${{ github.event.pull_request.number }}..."
          
          if gh pr merge ${{ github.event.pull_request.number }} --auto --squash --delete-branch; then
            echo "merge-enabled=true" >> $GITHUB_OUTPUT
            echo "✅ Auto-merge enabled successfully!"
          else
            echo "merge-enabled=false" >> $GITHUB_OUTPUT
            echo "⚠️ Auto-merge failed - may have conflicts or branch protection rules"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add success comment
        if: steps.auto-merge.outputs.merge-enabled == 'true'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "🎉 **TSA Monolith CI - All Checks Passed!**
          
          ✅ **Quality Gates Passed:**
          - 🔍 **ESLint**: Code quality verified
          - 🔧 **TypeScript**: Type checking passed  
          - 🛡️ **Security**: npm audit moderate+ passed
          - 🧪 **Tests**: 70%+ success rate achieved
          - 📁 **Scope**: Changes detected in \`services/tsa-monolith/\`
          
          🤖 **Auto-merge Enabled** - This PR will be automatically merged when all GitHub status checks complete.
          
          ---
          _TSA Logistics CI Pipeline_ 🚛"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 6: Final Summary
  notify-results:
    name: 📢 CI Summary
    runs-on: ubuntu-latest
    needs: [check-changes, lint-and-typecheck, security-analysis, run-tests, auto-merge]
    if: always()
    
    steps:
      - name: No changes detected
        if: needs.check-changes.outputs.monolith-changed == 'false'
        run: |
          echo "ℹ️ **No Changes in Monolith**"
          echo ""
          echo "No changes detected in \`services/tsa-monolith/\`"
          echo "🚀 Pipeline skipped - no action required"

      - name: Success summary
        if: |
          needs.check-changes.outputs.monolith-changed == 'true' &&
          contains(needs.*.result, 'success') && 
          !contains(needs.*.result, 'failure')
        run: |
          echo "🎉 **TSA Monolith CI Pipeline - SUCCESS**"
          echo ""
          echo "✅ **All quality gates passed:**"
          echo "   📁 Changes detected and validated"
          echo "   🔍 Code quality (ESLint)"
          echo "   🔧 Type safety (TypeScript)" 
          echo "   🛡️ Security analysis (npm audit moderate+)"
          echo "   🧪 Test coverage (70%+ success rate)"
          echo "   🤖 Auto-merge configured"
          echo ""
          echo "🚛 **Ready for deployment to develop branch!**"

      - name: Failure summary  
        if: |
          needs.check-changes.outputs.monolith-changed == 'true' &&
          contains(needs.*.result, 'failure')
        run: |
          echo "❌ **TSA Monolith CI Pipeline - FAILED**"
          echo ""
          echo "**Failed Checks:**"
          if [ "${{ needs.lint-and-typecheck.result }}" = "failure" ]; then
            echo "🔍 **Code Quality**: ESLint/TypeScript issues"
          fi
          if [ "${{ needs.security-analysis.result }}" = "failure" ]; then
            echo "🛡️ **Security**: High/critical vulnerabilities"
          fi
          if [ "${{ needs.run-tests.result }}" = "failure" ]; then
            echo "🧪 **Tests**: <70% success rate or failures"
          fi
          echo ""
          echo "**Fix Commands:**"
          echo "\`\`\`bash"
          echo "cd services/tsa-monolith"
          echo "npm run lint          # Fix code quality"
          echo "npm run typecheck     # Fix type errors"
          echo "npm audit fix         # Fix vulnerabilities"
          echo "npm test              # Run tests locally"
          echo "\`\`\`"
          echo ""
          echo "💡 **Review job logs above for detailed error information**"
          exit 1